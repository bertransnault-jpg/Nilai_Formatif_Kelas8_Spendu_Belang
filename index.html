<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi LKM & Raport IPA - SMP Negeri 2 Belang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .animate-pulse-subtle { animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    
    /* Sembunyikan Area Cetak di Layar Normal */
    .print-only-siswa, .print-only-guru, .print-only-raport { display: none; }

    /* Pengaturan Khusus Media Cetak / Print */
    @media print {
      body { background-color: white !important; color: black !important; }
      .no-print { display: none !important; }
      
      body.mode-print-siswa { display: block !important; }
      body.mode-print-guru { display: block !important; }
      body.mode-print-raport { display: block !important; }
      
      body.mode-print-siswa .print-only-siswa { display: block !important; }
      body.mode-print-guru .print-only-guru { display: block !important; }
      body.mode-print-raport .print-only-raport { display: block !important; }
      
      @page { margin: 1cm; size: A4 portrait; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen selection:bg-indigo-500 selection:text-white">

  <!-- HEADER RESPONSIF MODERN -->
  <header class="bg-slate-900/80 backdrop-blur-xl border-b border-slate-800 sticky top-0 z-40 no-print shadow-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-atom text-white text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-black tracking-tight text-white">SMP NEGERI 2 BELANG</h1>
            <span class="bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full">Fase D</span>
          </div>
          <p class="text-[11px] text-slate-400">Aplikasi Assessment & Raport IPA &bull; Guru: <span class="text-indigo-400 font-bold">N. Tora, S.Pd.</span></p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto justify-end">
        <button onclick="cetakLaporanSiswa()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-semibold px-3.5 py-2 rounded-xl text-xs flex items-center gap-2 shadow-sm transition hover:border-indigo-500/50">
          <i class="fa-solid fa-user text-indigo-400"></i> Cetak Siswa
        </button>
        <button onclick="cetakLaporanGuru()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-semibold px-3.5 py-2 rounded-xl text-xs flex items-center gap-2 shadow-sm transition hover:border-emerald-500/50">
          <i class="fa-solid fa-file-invoice text-emerald-400"></i> Rekap Guru
        </button>
        <button onclick="eksporExcel()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 shadow-lg shadow-indigo-600/20 transition">
          <i class="fa-solid fa-file-excel"></i> Ekspor CSV
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-8">

    <!-- FORM IDENTITAS SISWA -->
    <section class="bg-slate-900/60 border border-slate-800 rounded-3xl p-5 sm:p-6 backdrop-blur-xl no-print shadow-xl relative overflow-hidden">
      <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-indigo-500/5 rounded-full blur-3xl pointer-events-none"></div>
      <h2 class="text-xs sm:text-sm font-bold text-slate-200 mb-4 flex items-center gap-2.5 uppercase tracking-wider">
        <div class="w-7 h-7 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400">
          <i class="fa-solid fa-user-astronaut text-xs"></i>
        </div>
        Identitas Murid
      </h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">Nama Lengkap Murid</label>
          <input type="text" id="inputNama" placeholder="Masukkan nama lengkap siswa..." class="w-full text-sm px-4 py-3 bg-slate-950 border border-slate-800 rounded-2xl text-white placeholder-slate-600 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">Kelas</label>
          <select id="inputKelas" class="w-full text-sm px-4 py-3 bg-slate-950 border border-slate-800 rounded-2xl text-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition">
            <option value="VIII-A">Kelas VIII-A</option>
            <option value="VIII-B">Kelas VIII-B</option>
            <option value="VIII-C">Kelas VIII-C</option>
          </select>
        </div>
      </div>
      <div class="mt-5 flex justify-end">
        <button onclick="muatDataSiswa()" class="w-full sm:w-auto bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-xs font-bold px-6 py-3 rounded-2xl flex items-center justify-center gap-2.5 shadow-lg shadow-indigo-600/25 transition">
          <i class="fa-solid fa-cloud-arrow-down"></i> Muat Data dari Cloud
        </button>
      </div>
    </section>

    <!-- DASHBOARD STATISTIK -->
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6 no-print">
      <div class="lg:col-span-2 space-y-6">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-3xl flex items-center justify-between shadow-xl backdrop-blur-xl">
            <div>
              <p class="text-xs text-slate-400 font-medium">LKM Tuntas</p>
              <h3 id="statTuntas" class="text-2xl font-black text-emerald-400 mt-1">0 / 7</h3>
            </div>
            <div class="w-12 h-12 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl flex items-center justify-center text-emerald-400 text-xl shadow-inner">
              <i class="fa-solid fa-circle-check"></i>
            </div>
          </div>
          <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-3xl flex items-center justify-between shadow-xl backdrop-blur-xl">
            <div>
              <p class="text-xs text-slate-400 font-medium">Rata-Rata Formatif</p>
              <h3 id="statRataRata" class="text-2xl font-black text-indigo-
